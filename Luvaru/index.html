<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LUVARU · Plataforma KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F6F1EA; --surface:#FFFFFF; --surface-2:#FBF8F3; --surface-3:#F3EDE4;
  --ink:#1C1A17; --ink-2:#57514A; --muted:#8B847A;
  --line:#E9E2D7; --line-2:#D8CFC1;
  --accent:#B5653F; --accent-ink:#8F4A2A; --accent-soft:#F4E7DE;
  --good:#2E7D4F; --good-soft:#E3F1E7; --bad:#B23A3A; --bad-soft:#F9E3E1; --warn-ink:#8A5300; --warn-soft:#FDF1D6;
  --s1:#c0582a; --s2:#2a6fc4; --s3:#c98a00; --s4:#7a4fc0; --s5:#1b9a6c; --meta:#9A9286;
  --side:#1C1A17; --side-ink:#EDE6DA; --side-muted:#9C9488;
  --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.muted{color:var(--muted)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:28px 18px 20px;overflow-y:auto}
.brand{padding:0 10px 26px}
.logo{font:600 30px/1 var(--serif);letter-spacing:.32em;display:block}
.brand small{display:block;margin-top:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted)}
.nav-sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-size:13.5px;position:relative}
.nav a svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.09);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-18px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.nav .new{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#E9B79C}
.side-foot{margin-top:auto;padding:18px 10px 0;font-size:11.5px;line-height:1.5;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:var(--side-ink);font-weight:500}

main{min-width:0;padding:0 32px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:30px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin:0 0 6px}
h1{font:600 40px/1.05 var(--serif);margin:0;letter-spacing:-.005em}
.lede{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.top-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.period{font-size:12px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- Cards & grid ---------- */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card h2{font:600 22px/1.15 var(--serif);margin:0}
.card .sub{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.section-t{font:600 26px/1.1 var(--serif);margin:30px 0 4px}
.section-s{color:var(--ink-2);margin:0 0 14px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px;position:relative;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .v{font:600 27px/1.15 var(--sans);margin:8px 0 4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--ink);color:#F6F1EA;border-color:var(--ink)}
.kpi.hero .l,.kpi.hero .s{color:#BDB4A6}
.tone{width:8px;height:8px;border-radius:50%;flex:none}
.t-crit{background:var(--bad)}.t-warn{background:#E0A100}.t-over{background:#FF0000}.t-good{background:var(--good)}
.delta{font-weight:600;font-size:12px}
.up{color:var(--good)}.down{color:var(--bad)}

/* ---------- Semáforos (idénticos al Excel) ---------- */
.sem{display:inline-block;min-width:46px;padding:2px 8px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
.sm-low{background:#FFC7CE;color:#9C0006}
.sm-warn{background:#FFEB9C;color:#9C5700}
.sm-over{background:#FF0000;color:#FFFFFF}
.vx-1{background:#FF0000;color:#FFFFFF}
.vx-2{background:#FFC7CE;color:#9C0006}
.vx-3{background:#FFEB9C;color:#9C5700}
.vx-4{background:#C6EFCE;color:#375623}
.vx-5{background:#A9D08E;color:#006100}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.dot.sm-ok{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.legend-sem{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12px;color:var(--ink-2);margin:0 0 14px}
.legend-sem b{font-weight:600;color:var(--ink);margin-right:2px}
.legend-sem .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend-sem .sem{min-width:0;text-align:center;font-size:11.5px;padding:1px 7px}
.legend-sem .sem.plain{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}

/* ---------- Table ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:36px;min-width:240px;flex:0 1 300px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{border:0;outline:0;background:transparent;font:inherit;width:100%;color:var(--ink)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .cnt{margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .cnt{color:#CFC6B8}
.chip i.sw{margin-right:6px}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.tbl-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;background:var(--surface)}
table.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;font-size:11.5px;color:var(--ink-2)}
table.grid thead tr.g th{height:32px;font:600 13px var(--serif);font-size:14.5px;color:var(--ink);letter-spacing:.01em;border-bottom:1px solid var(--line)}
table.grid thead tr.h.two th{top:32px}
table.grid thead th.gl{text-align:center}
.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.arr{color:var(--accent);font-size:11px;min-width:8px}
th.num .sort{flex-direction:row-reverse}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.gs{border-left:1px solid var(--line-2)!important}
.st1{position:sticky;left:0;z-index:1}
.st2{position:sticky;left:48px;z-index:1;box-shadow:1px 0 0 var(--line)}
thead .st1,thead .st2{z-index:3}
td.st1.nwidth,th.st1.nwidth{width:48px;min-width:48px;max-width:48px}
.prod{font-weight:500}
tbody tr.row:hover td{background:#FCF7F1}
tr.exp{cursor:pointer}
tr.exp td.st2::before,tr.exp td.st1.p::before{content:"›";display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
tr.exp.open td.st2::before,tr.exp.open td.st1.p::before{transform:rotate(90deg)}
tr.exp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.detail td{background:var(--surface-2);white-space:normal;padding:14px 16px 16px}
tr.grp td{background:var(--surface-3);font-size:12.5px;color:var(--ink-2);position:sticky;left:0}
tr.grp b{font:600 16px var(--serif);color:var(--ink);margin-right:8px}
td.empty{text-align:center;color:var(--muted);padding:28px}
.foot{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 2px 0;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.foot button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer}
.foot button:disabled{opacity:.4;cursor:default}
.foot button.link{border:0;background:none;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}

.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.sw.pat{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 2px,transparent 2px 4px)}
.sw-varios{background:conic-gradient(#c0582a 0 25%,#2a6fc4 0 50%,#c98a00 0 75%,#1b9a6c 0)}

.cdet{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:12px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cd-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd-h .eyebrow{margin:0;font-size:10px}
.cd-n{font-weight:600;margin:8px 0 10px;display:flex;align-items:center}
.cd-bar{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:5px}
.cd-bar b{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;display:block}
.cd-bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.cd-bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.b-sold{background:var(--accent)}.b-stock{background:#6E665C}
.cd-f{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.cov{display:inline-block;width:70px;height:7px;background:var(--surface-3);border-radius:4px;vertical-align:1px;margin-right:8px;overflow:hidden}
.cov i{display:block;height:100%;border-radius:0 4px 4px 0;background:#6E665C}
.cov i.sm-low{background:#E8838F}.cov i.sm-warn{background:#E3B93B}.cov i.sm-over{background:#FF0000}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.p-agot{background:#1C1A17;color:#fff}.p-crit{background:var(--bad-soft);color:var(--bad)}.p-alta{background:var(--warn-soft);color:var(--warn-ink)}.p-media{background:var(--surface-3);color:var(--ink-2)}
.p-liq{background:var(--bad-soft);color:var(--bad)}.p-promo{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- Charts ---------- */
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:#ECE6DC;stroke-width:1}
.chart .grid.base{stroke:#CFC6B8}
.chart text{font:11px var(--sans);fill:var(--muted)}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--meta) 0 5px,transparent 5px 8px)!important}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,50%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);display:flex;align-items:center}
.hb-l .rk{color:var(--muted);width:20px;flex:none;font-variant-numeric:tabular-nums}
.hb-t{height:12px;display:block}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px}
.hb-v{font-variant-numeric:tabular-nums;color:var(--ink);min-width:54px;text-align:right}
.stack{display:flex;gap:2px;height:22px;margin:4px 0 16px}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:4px 0 0 4px}.stack i:last-child{border-radius:0 4px 4px 0}
.hl{width:100%;border-collapse:collapse;font-size:12.5px}
.hl td{padding:7px 0;border-bottom:1px solid var(--line)}
.hl tr:last-child td{border-bottom:0}
.hl .num{padding-left:10px}

.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ins li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ins li:last-child{border-bottom:0}
.ins .n{font:600 22px/1 var(--serif);color:var(--accent)}
.ins p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
.ins a{font-size:12px;font-weight:500;text-decoration:none}
.ins a:hover{text-decoration:underline}

.prog{display:flex;flex-direction:column;gap:16px}
.pg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;flex-wrap:wrap}
.pg-h b{font-weight:600;display:inline-flex;align-items:center;gap:8px}
.pg-h .sw{width:10px;height:10px;margin:0;box-shadow:none}
.pg-bar{position:relative;height:10px;background:var(--surface-3);border-radius:5px;margin-top:7px}
.pg-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;max-width:100%}
.pg-bar .m100{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.pg-s{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}

.hm{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.hm .c{height:26px;border-radius:4px}
.hm .rl{display:flex;align-items:center;font-size:11.5px;color:var(--ink-2)}
.hm .cl{text-align:center}
.hm-legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:12px}
.hm-legend span.g{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--accent))}

.note{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid #F1DDB0;border-radius:12px;padding:12px 16px;font-size:13px;color:#5C4210;margin-bottom:14px}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:#A36A00;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.strip b{color:var(--ink);font-weight:600}

/* ---------- Bsale ---------- */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;position:relative}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;position:relative}
.stage:not(:last-child)::after{content:"";position:absolute;right:-22px;top:50%;width:16px;height:16px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.stage .k{font:600 34px/1 var(--serif);color:var(--accent)}
.stage h3{margin:8px 0 6px;font:600 19px/1.2 var(--serif)}
.stage p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.stage ul{margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.stage li{padding:4px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.stage code{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent-ink)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:600;font-size:12px}
.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ba ul{margin:0;padding:0;list-style:none}
.ba li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ba li:last-child{border-bottom:0}
.ba .x{color:var(--bad);font-weight:700}.ba .v{color:var(--good);font-weight:700}
.ba .before{background:var(--surface-2)}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:f}
.road div{border-top:3px solid var(--accent);padding:12px 2px 0;font-size:12.5px;color:var(--ink-2)}
.road div:nth-child(n+2){border-top-color:#D9B9A5}
.road b{display:block;font:600 17px var(--serif);color:var(--ink);margin-bottom:4px}

.tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--ink);color:#F6F1EA;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.45;z-index:50;opacity:0;transition:opacity .08s;max-width:280px;box-shadow:0 8px 24px rgba(28,26,23,.22)}
.tip b{font-weight:600}
.tip .tr{display:flex;align-items:center;gap:7px;margin-top:3px}
.tip .tr i{width:9px;height:9px;border-radius:2px;flex:none}
.tip .tr span{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c3,.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:nth-child(2)::after{display:none}
  .road{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:14px;overflow:visible}
  .brand{padding:0;flex:none}
  .logo{font-size:21px;letter-spacing:.24em}
  .brand small,.nav-sec,.side-foot{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:12.5px}
  .nav a[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px}
  .nav .badge,.nav .new{display:none}
  main{padding:0 16px 40px}
  .top{flex-direction:column;align-items:flex-start;padding:22px 0 18px}

RV.filter(esPrenda).forEach(p => {

function niceStep(max, n = 4) {

    const X = i => m.l + (n <= 1 ? iw / 2 : i * iw / (n - 1)), Y = v => m.t + ih - v / ymax * ih;

    const svg = host.firstChild, hov = $(".hov", svg), hit = $(".chart-hit", svg), xl = $(".xh", svg), dots = $$("circle", hov);
    const move = e => {

  host.addEventListener("click", e => {
    const s = e.target.closest(".sort");
    if (s) { const i = +s.dataset.i; if (st.sortI === i) st.dir *= -1; else { st.sortI = i; st.dir = cols[i].num ? -1 : 1; } st.page = 0; draw(); return; }
    const f = e.target.closest(".chip[data-f]");
    if (f) { st.f = f.dataset.f; st.page = 0; $$(".chip[data-f]", host).forEach(x => { x.classList.toggle("on", x === f); x.setAttribute("aria-pressed", x === f); }); draw(); return; }
    const p = e.target.closest("[data-p]");
    if (p) { const a = p.dataset.p; if (a === "prev") st.page--; else if (a === "next") st.page++; else st.all = !st.all; draw(); wrap.scrollTop = 0; return; }
    const tr = e.target.closest("tr.exp");
    if (tr) { const k = tr.dataset.k; st.open.has(k) ? st.open.delete(k) : st.open.add(k); draw(); const again = $(`tr.exp[data-k="${CSS.escape(k)}"]`, tbody); if (again && e.detail === 0) again.focus(); }
  });
  host.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.exp")) { e.preventDefault(); e.target.click(); } });
  draw();
  return {draw, st};
}

const COLOR_GROUPS = [...colorCols("c1", "1° más vendido"), ...colorCols("c2", "2° más vendido"), ...colorCols("cm", "Menos vendido")];
const searchProdColor = r => [r.prod, r.c1?.name, r.c2?.name, r.cm?.name, r.color, r.col].join(" ");
function colorDetail(r) {
  const blocks = [["1° más vendido", r.c1], ["2° más vendido", r.c2], ["Menos vendido", r.cm]].filter(b => b[1]);
  if (!blocks.length) return '<p class="muted" style="margin:0">Este producto no tiene desglose por color.</p>';
  const max = Math.max(1, ...blocks.map(([, c]) => Math.max(c.stock || 0, c.cant || 0)));
  return `<div class="cdet">${blocks.map(([t, c]) => `<div class="cd">

      <div class="hm-legend"><span>Menos venta</span><span class="g"></span><span>Más venta</span></div>`;

  $$("#hch .chip", el).forEach(btn => btn.addEventListener("click", () => {
    selH = TS.hmSel = btn.dataset.h;

  const ys = [{name: "2022", color: "var(--meta)", ys: yr(2022)}, {name: "2023", color: "var(--s2)", ys: yr(2023)}, {name: "2024", color: "var(--accent)", ys: yr(2024)}];
  $("#lg3", el).innerHTML = legend(ys);
  lineChart($("#ch3", el), {xs: MES, series: ys, yFmt: v => fSolK(v).replace("S/ ", ""), tipFmt: v => fSol(v), h: 250, sortTip: false, label: "Venta mensual por año"});
};

function route() {
  const id = location.hash.slice(1);
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  CHARTS = []; hideTip();
  $("#eyebrow").textContent = v.eyebrow; $("#title").textContent = v.title; $("#lede").textContent = v.lede; $("#period").textContent = v.period;
  $$("#nav a").forEach(a => a.dataset.v === v.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const cur = $(`#nav a[data-v="${v.id}"]`); if (cur && cur.scrollIntoView && innerWidth <= 900) cur.scrollIntoView({block: "nearest", inline: "center"});
  document.title = `${v.label} · LUVARU`;
  const el = $("#view"); el.innerHTML = ""; V[v.id](el);
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => CHARTS.forEach(f => f()), 120); });
route();
